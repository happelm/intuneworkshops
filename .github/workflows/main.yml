name: Link Checker

on:
  schedule:
    - cron: '17 5 * * *' # täglich 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false          # Exit-Code wird unten selbst ausgewertet
          output: lychee/out.md
          args: >-
            --verbose --no-progress
            --max-retries 3 --retry-wait-time 5
            --timeout 30
            --accept '100..=103,200..=299,429'
            './*Links.md'

      - name: Create or update issue
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Link Checker Report"
          num=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file lychee/out.md
          else
            gh issue create --title "$title" --body-file lychee/out.md
          fi

      - name: Close issue when all links are fine
        if: steps.lychee.outputs.exit_code == 0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          num=$(gh issue list --state open --search 'in:title "Link Checker Report"' --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue close "$num" --comment "All links OK."; fi

      - name: Fail job on broken links
        if: steps.lychee.outputs.exit_code != 0
        run: exit 1
